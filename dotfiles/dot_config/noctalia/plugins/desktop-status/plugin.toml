id = "accel-os/desktop-status"
name = "Desktop status"
version = "1.0.0"
plugin_api = 24
description = "Pi agent activity, failed systemd units, and the current Sway binding mode."
dependencies = [
  "accel-node",
  "cat",
  "notify-send",
  "systemctl",
  "systemctl-tui",
  "systemd-inhibit",
  "swaymsg",
  "xterm",
]

[[service]]
id = "pi-activity"
entry = "pi-activity.luau"

[[service]]
id = "failed-unit-monitor"
entry = "failed-units-service.luau"

[[widget]]
id = "pi-agents"
entry = "pi-agents.luau"

[[widget]]
id = "failed-units"
entry = "failed-units.luau"

[[widget]]
id = "sway-mode"
entry = "sway-mode.luau"
