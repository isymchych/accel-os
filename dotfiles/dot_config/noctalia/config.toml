# Native Noctalia 5.4.1. App-managed settings.toml overrides this file.
[accessibility]
ui_scale = 1.15

[shell]
font_family = "JetBrains Mono Nerd Font"
setup_wizard_enabled = false
telemetry_enabled = false
offline_mode = false
external_ip_enabled = false
screen_time_enabled = false
polkit_agent = true
clipboard_enabled = true
clipboard_history_max_entries = 1000
clipboard_keep_from_closed_apps = false
clipboard_auto_paste = "off"
launch_apps_as_systemd_services = true

[shell.keyboard_layout.custom_labels]
"English (US)" = "🇺🇸"
"Ukrainian" = "🇺🇦"

[shell.animation]
enabled = true
speed = 1.5

[shell.launcher]
auto_paste = "off"
fetch_exchange_rates = false

[shell.launcher.dmenu.entry.templates]
command = "mb-template list"
label = "Templates"
prefix = "tpl"
glyph = "clipboard-text"
global = false
freeform = false
exec = "mb-template copy '{selection}'"

[shell.screenshot]
annotate = true
# Automatic region completion closes without opening the editor on this host.
confirm_region = true
copy_on_close = false
directory = "~/temp/screenshots"

[theme]
# Follow the day/night schedule; only GTK, Qt, and Sway use built-in recoloring.
mode = "auto"
shell_mode = "follow"
source = "custom"
custom_palette = "Solarized-Nord"
sync_color_scheme = true

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["gtk3", "gtk4", "sway", "qt"]
enable_community_templates = false

[hooks]
# The shipped Sway hook adds the include but does not reload the compositor.
# colors_changed runs after template rendering and hooks have finished.
colors_changed = 'if [ -n "${SWAYSOCK:-}" ]; then swaymsg reload; fi'
# Switching variants does not change the full palette in Noctalia 5.4.1.
# Force application so colors_changed reloads Sway after the new files are ready.
theme_mode_changed = [
  'notify-send --app-name=Noctalia --urgency=low "switching to $NOCTALIA_THEME_MODE mode"',
  'noctalia msg templates-apply',
]

[wallpaper]
enabled = true
fill_mode = "crop"
directory = "~/Pictures/wallpapers"
per_monitor_directories = false

[wallpaper.default]
path = "color:#002B36"

[wallpaper.automation]
enabled = true
interval_seconds = 1800
order = "random"
recursive = false

[dock]
enabled = false

[desktop_widgets]
enabled = false

[location]
auto_locate = false
address = ""
latitude = 50.470666901477415
longitude = 30.514520179219673
custom_schedule = false

[nightlight]
enabled = true
force = false
temperature_day = 6500
temperature_night = 4000

[weather]
enabled = false

[lockscreen]
enabled = true
lock_before_suspend = true
grace_period_seconds = 4
transition = ["fade"]
transition_duration = 600

[lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
show_media = false

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
show_media = false

[idle.behavior.lock]
enabled = true
action = "lock"
timeout = 140

[idle.behavior.screen-off]
enabled = true
action = "screen_off"
timeout = 120

[idle.behavior.suspend]
enabled = true
action = "suspend"
timeout = 300

[brightness]
enable_ddcutil = true
minimum_brightness = 0.05

[notification]
enable_daemon = true
filter_order = ["default-timeout"]
follow_focused_output = true
history_retention_hours = 6
keep_dismissed_in_history = true
max_visible = 3
position = "top_right"
show_progress_bar = false
width = 500
offset_y = 25
background_opacity = 0.82

[notification.filter.default-timeout]
enabled = true
match_content = ".*"
override_duration = 3700

[control_center]
width = 1000

[control_center.calendar]
show_events_card = false

[osd]
enabled = true
follow_focused_output = true

[osd.kinds]
lock_keys = false
media = false

[[shell.session.actions]]
action = "lock"
shortcut = "1"

[[shell.session.actions]]
action = "logout"
shortcut = "2"
countdown_seconds = 5

[[shell.session.actions]]
action = "lock_and_suspend"
shortcut = "3"
countdown_seconds = 5

[[shell.session.actions]]
action = "reboot"
shortcut = "4"
countdown_seconds = 5

[[shell.session.actions]]
action = "shutdown"
shortcut = "5"
countdown_seconds = 5

[bar]
order = ["default", "right"]

# The top layout keeps its original name for existing app-managed overrides.
[bar.default]
enabled = true
position = "top"
thickness = 40
auto_hide = false
reserve_space = true
margin_ends = 0
radius = 0
concave_edge_corners = false
shadow = false
capsule_radius = 0
scale = 1.1
font_scale = 1.15
padding = 14
widget_spacing = 10
start = [
  "launcher",
  "launcher-gap",
  "cpu",
  "cpu-gap",
  "memory",
  "memory-gap",
  "disk",
  "disk-gap",
  "brightness",
  "brightness-gap",
  "battery",
  "metrics-gap",
  "workspaces",
  "sway-mode",
]
center = ["media-art", "media-title-gap", "media"]
end = [
  "failed-units",
  "notifications",
  "notifications-gap",
  "pi-agents",
  "agents-gap",
  "network",
  "bluetooth",
  "playback",
  "caffeine",
  "keyboard_layout",
  "privacy",
  "tray",
  "clock-gap",
  "date",
  "clock",
]

# scripts/bar-layout persists which layout is enabled through native config-set.
[bar.right]
enabled = false
position = "right"
thickness = 60
auto_hide = false
reserve_space = true
margin_ends = 0
radius = 0
concave_edge_corners = false
shadow = false
capsule_radius = 0
# Shared status widgets already have their own 1.25 scale.
scale = 1.0
font_scale = 1.1
padding = 8
widget_spacing = 8
start = ["launcher", "right-clock", "right-date", "right-date-gap", "workspaces", "sway-mode"]
center = [
  "right-media-art",
  "right-media-gap",
  "failed-units",
  "notifications",
  "playback",
  "privacy",
  "right-audio-gap",
  "network",
  "bluetooth",
  "tray",
  "right-connectivity-gap",
  "keyboard_layout",
  "caffeine",
  "right-center-balance-gap",
]
end = [
  "pi-agents",
  "right-status-gap",
  "cpu",
  "memory",
  "disk",
  "right-metrics-gap",
  "brightness",
  "battery",
]

[widget.right-date-gap]
type = "spacer"
length = 12

[widget.right-media-art]
type = "media"
album_art_only = true
art_size = 48
hide_when_no_media = true

[widget.right-media-gap]
type = "spacer"
length = 32

# Shift the visible center section upward without moving the start/end sections.
[widget.right-center-balance-gap]
type = "spacer"
length = 64

[widget.right-audio-gap]
type = "spacer"
length = 8

[widget.right-connectivity-gap]
type = "spacer"
length = 8

[widget.right-status-gap]
type = "spacer"
length = 8

[widget.right-metrics-gap]
type = "spacer"
length = 8

[widget.launcher-gap]
type = "spacer"
length = 32

[widget.clock-gap]
type = "spacer"
length = 32

[widget.media-art]
type = "media"
album_art_only = true
art_size = 32
hide_when_no_media = true

[widget.media-title-gap]
type = "spacer"
length = 16

[widget.media]
type = "media"
hide_album_art = true
max_length = 500
hide_when_no_media = true

[widget.metrics-gap]
type = "spacer"
length = 32

[widget.agents-gap]
type = "spacer"
length = 16

[widget.notifications-gap]
type = "spacer"
length = 32

[widget.cpu-gap]
type = "spacer"
length = 16

[widget.memory-gap]
type = "spacer"
length = 16

[widget.disk-gap]
type = "spacer"
length = 16

[widget.brightness-gap]
type = "spacer"
length = 16

[widget.clock]
type = "clock"
format = "{:%H:%M}"
color = "primary"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.clock.actions]
right = "none"

[widget.date]
type = "clock"
format = "{:%a %b %d}"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.date.actions]
right = "none"

[widget.right-clock]
type = "clock"
vertical_format = "{:%H:%M}"
font_scale = 1.2
color = "primary"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.right-clock.actions]
right = "none"

[widget.right-date]
type = "clock"
vertical_format = "{:%b %d}\n{:%a}"
font_scale = 0.8
tooltip_format = "{:%A, %B %d, %Y}"

[widget.right-date.actions]
right = "none"

[widget.notifications]
type = "notifications"
scale = 1.25
# Keep the native right-click DND toggle available even with no unread notifications.
hide_when_no_unread = false

[widget.workspaces]
type = "workspaces"
font_scale = 1.1
show_all_outputs = true
style = "minimal"
active_pill_size = 1.0
inactive_pill_size = 1.0
focused_color = "primary"
occupied_color = "on_surface"
empty_color = "on_surface_variant"
change_color_on_hover = false

[widget.workspaces.actions]
scroll_up = "none"
scroll_down = "none"

[widget.sway-mode]
type = "accel-os/desktop-status:sway-mode"

[widget.playback]
type = "volume"
scale = 1.25
device = "output"
show_label = false
mute_color = "on_surface_variant"

[widget.playback.actions]
right = "exec pavucontrol"

[widget.privacy]
type = "privacy"
scale = 1.25
hide_inactive = true

[widget.network]
type = "network"
scale = 1.25
show_label = false
vpn_status = "both"

[widget.bluetooth]
scale = 1.25

[widget.bluetooth.actions]
right = "exec xterm run --class=bluetui -- bluetui"

[widget.tray]
drawer = false
scale = 1.25

[widget.caffeine]
scale = 1.25

[widget.keyboard_layout]
show_glyph = false
show_label = true
font_scale = 1.0

[widget.pi-agents]
type = "accel-os/desktop-status:pi-agents"

[widget.failed-units]
type = "accel-os/desktop-status:failed-units"
show_tooltip = true
scale = 1.4
font_weight = 700
color = "error"
capsule = false

[widget.failed-units.actions]
# Free left-click for the plugin to acknowledge and open the manager.
left = "none"
right = "none"
middle = "none"

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "none"
# Reserve a two-digit percentage at the top bar's font scale.
label_min_width = 30

[widget.cpu.actions]
right = "exec xterm run -- htop --sort-key=PERCENT_CPU"

[widget.memory]
type = "sysmon"
stat = "ram_pct"
visualization = "none"
label_min_width = 30

[widget.memory.actions]
right = "exec xterm run -- htop --sort-key=PERCENT_MEM"

[widget.disk]
type = "sysmon"
stat = "disk_used_pct"
path = "/home"
visualization = "none"
label_min_width = 30

[widget.disk.actions]
right = "exec xterm run --class=disk-usage -- sh -c 'dust --depth 3 --number-of-lines 30 --reverse --limit-filesystem --print-errors /home; printf \"\\nPress Enter to close.\"; read -r _'"

[widget.brightness]
show_label = true

[battery]
warning_threshold = 20

[widget.battery]
warning_color = "error"

[system.monitor]
cpu_poll_seconds = 3
memory_poll_seconds = 3
disk_poll_seconds = 30
cpu_temp_sensor_path = "" # Auto-detect the CPU sensor; hwmon numbers change between boots.
cpu_usage_activity_threshold = 60
cpu_usage_critical_threshold = 95
ram_pct_activity_threshold = 60
ram_pct_critical_threshold = 90
cpu_temp_activity_threshold = 55
cpu_temp_critical_threshold = 70
disk_used_pct_activity_threshold = 75
disk_used_pct_critical_threshold = 95

[plugins]
enabled = ["accel-os/desktop-status", "accel-os/clipboard-actions"]
auto_update = "none"

[[plugins.source]]
name = "accel-os"
kind = "path"
location = "~/.config/noctalia/plugins"
enabled = true
