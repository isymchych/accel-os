# Native Noctalia 5.4.1. App-managed settings.toml overrides this file.
[accessibility]
ui_scale = 1.15

[shell]
font_family = "JetBrains Mono Nerd Font"
setup_wizard_enabled = false
telemetry_enabled = false
offline_mode = true
external_ip_enabled = false
screen_time_enabled = false
polkit_agent = true
clipboard_enabled = true
clipboard_keep_from_closed_apps = false
clipboard_auto_paste = "off"
launch_apps_as_systemd_services = true

[shell.animation]
enabled = true
speed = 1.5

[shell.launcher]
auto_paste = "off"

[shell.launcher.dmenu.entry.templates]
command = "mb-template list"
label = "Templates"
prefix = "tpl"
glyph = "clipboard-text"
global = false
freeform = false
exec = "mb-template copy '{selection}'"

[shell.screenshot]
annotate = true
# Automatic region completion closes without opening the editor on this host.
confirm_region = true
copy_on_close = false
directory = "~/temp/screenshots"

[theme]
# Application templates and desktop color-scheme keep following the day/night schedule.
mode = "auto"
shell_mode = "dark"
source = "custom"
custom_palette = "Solarized"
sync_color_scheme = true

[theme.templates]
enable_builtin_templates = false
enable_community_templates = false

[hooks]
theme_mode_changed = 'notify-send --app-name=Noctalia --urgency=low "switching to $NOCTALIA_THEME_MODE mode"'

[wallpaper]
enabled = true

[wallpaper.default]
path = "color:#002B36"

[dock]
enabled = false

[desktop_widgets]
enabled = false

[location]
auto_locate = false
address = ""
latitude = 50.470666901477415
longitude = 30.514520179219673
custom_schedule = false

[nightlight]
enabled = true
force = false
temperature_day = 6500
temperature_night = 4000

[weather]
enabled = false

[lockscreen]
enabled = true
lock_before_suspend = true
grace_period_seconds = 4
transition = ["fade"]
transition_duration = 600

[lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
show_media = false

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
show_media = false

[idle.behavior.lock]
enabled = true
action = "lock"
timeout = 140

[idle.behavior.screen-off]
enabled = true
action = "screen_off"
timeout = 120

[idle.behavior.suspend]
enabled = true
action = "suspend"
timeout = 300

[brightness]
enable_ddcutil = true
minimum_brightness = 0.05

[notification]
enable_daemon = true
keep_dismissed_in_history = true
max_visible = 7
position = "top_right"
width = 500
offset_y = 25
background_opacity = 0.82

[control_center]
width = 1000

[control_center.calendar]
show_events_card = false

[osd]
enabled = true
follow_focused_output = true

[osd.kinds]
lock_keys = false

[[shell.session.actions]]
action = "lock"
shortcut = "1"

[[shell.session.actions]]
action = "logout"
shortcut = "2"
countdown_seconds = 5

[[shell.session.actions]]
action = "lock_and_suspend"
shortcut = "3"
countdown_seconds = 5

[[shell.session.actions]]
action = "reboot"
shortcut = "4"
countdown_seconds = 5

[[shell.session.actions]]
action = "shutdown"
shortcut = "5"
countdown_seconds = 5

[bar]
order = ["default"]

[bar.default]
position = "right"
thickness = 60
margin_ends = 0
radius = 0
concave_edge_corners = false
shadow = false
capsule_radius = 0
scale = 1.25
padding = 8
widget_spacing = 8
start = ["launcher", "clock", "date", "workspaces", "sway-mode"]
center = ["notifications", "playback", "privacy", "audio-gap", "network", "bluetooth", "power_profile", "tray", "connectivity-gap", "keyboard_layout", "caffeine", "center-balance-gap"]
end = ["pi-agents", "failed-units", "status-gap", "cpu", "memory", "disk", "metrics-gap", "brightness", "battery"]

# Shift the visible center section upward without moving the start/end sections.
[widget.center-balance-gap]
type = "spacer"
length = 64

[widget.audio-gap]
type = "spacer"
length = 8

[widget.connectivity-gap]
type = "spacer"
length = 8

[widget.status-gap]
type = "spacer"
length = 8

[widget.metrics-gap]
type = "spacer"
length = 8

[widget.clock]
type = "clock"
vertical_format = "{:%H:%M}"

[widget.clock.actions]
right = "none"

[widget.date]
type = "clock"
font_scale = 0.8
vertical_format = "{:%b %d}\n{:%a}"

[widget.date.actions]
right = "none"

[widget.notifications]
type = "notifications"
# Keep the native right-click DND toggle available even with no unread notifications.
hide_when_no_unread = false

[widget.workspaces]
type = "workspaces"
font_scale = 1.1
show_all_outputs = true
style = "minimal"
active_pill_size = 1.0
inactive_pill_size = 1.0
focused_color = "primary"
occupied_color = "on_surface"
empty_color = "on_surface_variant"
change_color_on_hover = false

[widget.workspaces.actions]
scroll_up = "none"
scroll_down = "none"

[widget.sway-mode]
type = "accel-os/desktop-status:sway-mode"

[widget.playback]
type = "volume"
device = "output"
show_label = false
mute_color = "on_surface_variant"

[widget.playback.actions]
right = "exec pavucontrol"

[widget.privacy]
type = "privacy"
hide_inactive = true

[widget.bluetooth.actions]
right = "exec xterm run --class=bluetui -- bluetui"

[widget.network]
type = "network"
show_label = false
vpn_status = "both"

[widget.keyboard_layout]
show_glyph = false

[widget.pi-agents]
type = "accel-os/desktop-status:pi-agents"

[widget.failed-units]
type = "accel-os/desktop-status:failed-units"
show_tooltip = false
color = "error"

[widget.failed-units.actions]
left = "exec xterm run --class=systemd-manager -- systemctl-tui --scope all --no-log --limit-units '*'"
right = "none"
middle = "none"

[widget.cpu]
type = "sysmon"
font_scale = 0.88
stat = "cpu_usage"
visualization = "none"

[widget.cpu.actions]
right = "exec xterm run -- htop --sort-key=PERCENT_CPU"

[widget.memory]
type = "sysmon"
font_scale = 0.88
stat = "ram_pct"
visualization = "none"

[widget.memory.actions]
right = "exec xterm run -- htop --sort-key=PERCENT_MEM"

[widget.disk]
type = "sysmon"
font_scale = 0.88
stat = "disk_used_pct"
path = "/home"
visualization = "none"

[widget.disk.actions]
right = "exec xterm run --class=disk-usage -- sh -c 'dust --depth 3 --number-of-lines 30 --reverse --limit-filesystem --print-errors /home; printf \"\\nPress Enter to close.\"; read -r _'"

[widget.brightness]
font_scale = 0.88

[widget.battery]
font_scale = 0.88

[system.monitor]
cpu_poll_seconds = 3
memory_poll_seconds = 3
disk_poll_seconds = 30
cpu_temp_sensor_path = "" # Auto-detect the CPU sensor; hwmon numbers change between boots.
cpu_usage_activity_threshold = 60
cpu_usage_critical_threshold = 95
ram_pct_activity_threshold = 60
ram_pct_critical_threshold = 90
cpu_temp_activity_threshold = 55
cpu_temp_critical_threshold = 70
disk_used_pct_activity_threshold = 75
disk_used_pct_critical_threshold = 95

[plugins]
enabled = ["accel-os/desktop-status", "accel-os/clipboard-actions"]
auto_update = "none"

[[plugins.source]]
name = "accel-os"
kind = "path"
location = "~/.config/noctalia/plugins"
enabled = true
